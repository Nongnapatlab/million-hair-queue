<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 2500px; height: 1686px; overflow: hidden; }
  body { background: #14294A; font-family: 'Prompt', sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); width: 2500px; height: 1686px; }
  .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px;
    border-right: 3px solid #26406A; border-bottom: 3px solid #26406A; color: #F4F6F3; }
  .cell:nth-child(3n) { border-right: 0; }
  .cell:nth-child(n+4) { border-bottom: 0; }
  .cell.main { background: #F4A259; color: #14294A; }
  svg { width: 220px; height: 220px; fill: none; stroke: #F4A259; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .main svg { stroke: #14294A; }
  .th { font-size: 112px; font-weight: 600; line-height: 1; }
  .en { font-size: 44px; font-weight: 500; letter-spacing: 10px; color: #8FA3BC; }
  .main .en { color: #5A3A12; }
</style>
</head>
<body>
<div class="grid">
  <div class="cell main">
    <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.1 8.1 20 20M8.1 15.9 20 4"/></svg>
    <div class="th">ลงคิว</div><div class="en">JOIN QUEUE</div>
  </div>
  <div class="cell">
    <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2.5 2.5 0 0 0 0 5v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2.5 2.5 0 0 0 0-5Z"/><path d="M14 5v14" stroke-dasharray="1.5 1.8"/></svg>
    <div class="th">คิวของฉัน</div><div class="en">MY QUEUE</div>
  </div>
  <div class="cell">
    <svg viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>
    <div class="th">บริการ & ราคา</div><div class="en">SERVICES</div>
  </div>
  <div class="cell">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-6 6.5-6s5.9 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4.3 2 4.8 5"/></svg>
    <div class="th">ทีมช่าง</div><div class="en">STYLISTS</div>
  </div>
  <div class="cell">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    <div class="th">ช่วงคนน้อย</div><div class="en">BEST TIME</div>
  </div>
  <div class="cell">
    <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
    <div class="th">ข้อมูลร้าน</div><div class="en">ABOUT US</div>
  </div>
</div>
</body>
</html>
